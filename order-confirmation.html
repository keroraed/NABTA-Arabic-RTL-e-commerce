<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تم استلام طلبك | نبته NABTA</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #FCFAF5; color: #0E2A1B; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: #176B3A; color: #FCFAF5; }
    :focus-visible { outline: 2px solid #176B3A; outline-offset: 3px; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .tick-wrap { animation: pop .5s cubic-bezier(.22,.61,.36,1) both; }
    .tick-path { stroke-dasharray: 32; stroke-dashoffset: 32; animation: draw .45s .35s ease-out forwards; }
    @media (prefers-reduced-motion: reduce) { .tick-wrap, .tick-path { animation: none; stroke-dashoffset: 0; } }
    .card { background: #fff; border: 1px solid rgba(14,42,27,.1); border-radius: 4px; }
    @media (max-width: 800px) { .oc-grid { grid-template-columns: 1fr !important; } }
  </style>
</head>
<body>

  <div data-nabta-header></div>

  <main style="padding-top:76px">
    <section style="max-width:980px;margin:0 auto;padding:clamp(40px,7vw,80px) clamp(16px,4vw,44px) clamp(60px,9vw,110px)">

      <div style="text-align:center;margin-bottom:clamp(34px,5vw,52px)">
        <div class="tick-wrap" style="width:78px;height:78px;margin:0 auto 22px;border-radius:50%;background:rgba(23,107,58,.12);display:grid;place-items:center">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#176B3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="tick-path" d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <h1 style="margin:0;font-size:clamp(1.7rem,4vw,2.7rem);font-weight:700;letter-spacing:-.02em">تم استلام طلبك بنجاح</h1>
        <p style="margin:16px auto 0;max-width:56ch;font-size:15.5px;line-height:1.9;color:#3A483D;font-weight:300">
          شكراً لثقتك في نبته. سنتواصل معك هاتفياً خلال ٢٤ ساعة لتأكيد الطلب وموعد التسليم.
        </p>
        <p style="margin:22px 0 0;font-size:14px;color:#6B4630">رقم الطلب</p>
        <p data-order-no style="margin:6px 0 0;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;color:#176B3A;letter-spacing:.06em">—</p>
      </div>

      <div data-demo-note style="display:none;margin:0 0 28px;padding:14px 18px;background:#FFF8E8;border:1px solid #E8D9B0;border-radius:3px;font-size:13px;color:#6B4630;line-height:1.8"></div>

      <div data-details class="oc-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2.5vw,28px);align-items:start"></div>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:clamp(32px,5vw,48px)">
        <a href="shop.html" style="background:#0E2A1B;color:#F5EBD8;font-size:15px;font-weight:600;padding:16px 40px;border-radius:2px">متابعة التسوّق</a>
        <a href="NABTA.dc.html#home" style="border:1.5px solid #0E2A1B;color:#0E2A1B;font-size:15px;font-weight:600;padding:16px 40px;border-radius:2px">العودة للرئيسية</a>
      </div>

      <div style="margin-top:clamp(34px,5vw,50px);padding:20px 22px;background:#F5EBD8;border-radius:4px;display:flex;align-items:flex-start;gap:14px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#176B3A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        <p style="margin:0;font-size:13.5px;line-height:1.85;color:#2C3E30">
          <strong style="font-weight:600">لم يصلك اتصال؟</strong> تواصل معنا على <span dir="ltr" style="font-weight:600">+20 100 000 0000</span> واذكر رقم الطلب.
        </p>
      </div>
    </section>
  </main>

  <div data-nabta-footer></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/nabta-shop.js"></script>
  <script src="assets/js/nabta-chrome.js"></script>
  <script>
    (function () {
      var S = window.NabtaShop;
      NabtaChrome.mount('shop');

      var qsOrder = new URLSearchParams(location.search).get('order');
      var rec = S.lastOrder();
      var orderNo = qsOrder || (rec && rec.orderNumber) || null;

      /* Landing here directly (refresh, bookmark, back button) with no order in
         session is a normal state, not an error — send them somewhere useful. */
      if (!orderNo) {
        document.querySelector('[data-order-no]').textContent = '—';
        document.querySelector('[data-details]').innerHTML =
          '<div class="card" style="grid-column:1/-1;padding:26px;text-align:center">' +
            '<p style="margin:0 0 6px;font-size:16px;font-weight:600">لا يوجد طلب لعرضه</p>' +
            '<p style="margin:0;font-size:14px;color:#3A483D;font-weight:300">ربما تم تحديث الصفحة بعد انتهاء الجلسة.</p>' +
          '</div>';
        return;
      }

      document.querySelector('[data-order-no]').textContent = orderNo;

      if (S.isDemo) {
        var n = document.querySelector('[data-demo-note]');
        n.style.display = 'block';
        n.innerHTML = '<strong style="font-weight:600">وضع العرض:</strong> لم يتم إرسال هذا الطلب إلى أي سيرفر — رقم الطلب أعلاه تجريبي. بعد ربط الـ API سيصدر الرقم من السيرفر.';
      }

      if (!rec || !rec.payload) return;
      var o = rec.payload;

      function row(label, value) {
        return '<div style="display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(14,42,27,.07)">' +
          '<span style="font-size:13.5px;color:#6B4630;flex:0 0 auto">' + label + '</span>' +
          '<span style="font-size:13.5px;font-weight:600;text-align:end">' + value + '</span>' +
        '</div>';
      }

      var itemsHTML = o.items.map(function (it) {
        return '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(14,42,27,.07)">' +
          '<span style="font-size:13.5px;line-height:1.6">' + it.name + ' <span style="color:#6B4630">× ' + it.qty + '</span></span>' +
          '<span style="font-size:13.5px;font-weight:600;white-space:nowrap">' + S.fmt(it.lineTotal) + '</span>' +
        '</div>';
      }).join('');

      document.querySelector('[data-details]').innerHTML = '' +
        '<div class="card" style="padding:clamp(18px,2.5vw,26px)">' +
          '<h2 style="margin:0 0 14px;font-size:16px;font-weight:700">تفاصيل الطلب</h2>' +
          itemsHTML +
          '<div style="margin-top:12px">' +
            row('المجموع الفرعي', S.fmt(o.amounts.subtotal)) +
            row('الشحن', o.amounts.shipping === 0 ? 'مجاني' : S.fmt(o.amounts.shipping)) +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;padding-top:14px;border-top:2px solid rgba(14,42,27,.12)">' +
            '<span style="font-size:15px;font-weight:700">الإجمالي</span>' +
            '<span style="font-size:19px;font-weight:700;color:#176B3A">' + S.fmt(o.amounts.total) + '</span>' +
          '</div>' +
          '<p style="margin:12px 0 0;font-size:12.5px;color:#6B4630">طريقة الدفع: الدفع عند الاستلام</p>' +
        '</div>' +

        '<div class="card" style="padding:clamp(18px,2.5vw,26px)">' +
          '<h2 style="margin:0 0 14px;font-size:16px;font-weight:700">بيانات التوصيل</h2>' +
          row('الاسم', o.customer.fullName) +
          row('الموبايل', '<span dir="ltr">' + o.customer.phone + '</span>') +
          (o.customer.altPhone ? row('رقم بديل', '<span dir="ltr">' + o.customer.altPhone + '</span>') : '') +
          row('المحافظة', o.shippingAddress.governorate) +
          row('المدينة', o.shippingAddress.city) +
          '<div style="padding:9px 0">' +
            '<p style="margin:0 0 4px;font-size:13.5px;color:#6B4630">العنوان</p>' +
            '<p style="margin:0;font-size:13.5px;font-weight:600;line-height:1.8">' + o.shippingAddress.addressLine + '</p>' +
            (o.shippingAddress.landmark ? '<p style="margin:6px 0 0;font-size:13px;color:#3A483D">علامة مميزة: ' + o.shippingAddress.landmark + '</p>' : '') +
          '</div>' +
          (o.notes ? '<div style="padding:9px 0;border-top:1px solid rgba(14,42,27,.07)"><p style="margin:0 0 4px;font-size:13.5px;color:#6B4630">ملاحظات</p><p style="margin:0;font-size:13.5px;line-height:1.8">' + o.notes + '</p></div>' : '') +
        '</div>';
    })();
  </script>
</body>
</html>
