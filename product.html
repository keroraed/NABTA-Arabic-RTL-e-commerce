<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفاصيل المنتج | نبته NABTA</title>
  <meta name="description" content="تفاصيل المنتج — منتجات نبته الطبيعية، الدفع عند الاستلام.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #FCFAF5; color: #0E2A1B; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }
    ::selection { background: #176B3A; color: #FCFAF5; }
    :focus-visible { outline: 2px solid #176B3A; outline-offset: 3px; }
    .thumb { border: 1px solid rgba(14,42,27,.12); border-radius: 3px; background: #F5EBD8; cursor: pointer; padding: 8px; transition: border-color .2s ease; }
    .thumb[aria-pressed="true"] { border-color: #176B3A; border-width: 2px; }
    .qty-btn { width: 44px; height: 48px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #0E2A1B; transition: background .2s ease; }
    .qty-btn:hover { background: rgba(14,42,27,.06); }
    .qty-btn:disabled { color: rgba(14,42,27,.25); cursor: not-allowed; }
    .btn-primary { border: 0; cursor: pointer; background: #0E2A1B; color: #F5EBD8; font-size: 15px; font-weight: 600; padding: 17px 30px; border-radius: 2px; min-height: 56px; transition: background .25s ease; }
    .btn-primary:hover { background: #176B3A; }
    .btn-primary:disabled { background: rgba(14,42,27,.25); cursor: not-allowed; }
    .btn-ghost { border: 1.5px solid #0E2A1B; cursor: pointer; background: transparent; color: #0E2A1B; font-size: 15px; font-weight: 600; padding: 17px 30px; border-radius: 2px; min-height: 56px; transition: all .25s ease; }
    .btn-ghost:hover { background: #0E2A1B; color: #F5EBD8; }
    .acc-head { width: 100%; text-align: start; border: 0; background: transparent; cursor: pointer; padding: 18px 0; font-size: 15px; font-weight: 600; color: #0E2A1B; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    @media (max-width: 900px) { .pdp-grid { grid-template-columns: 1fr !important; } }
  </style>
</head>
<body>

  <div data-nabta-header></div>

  <main data-pdp style="padding-top:76px"></main>

  <div data-nabta-footer></div>

  <div data-toast style="position:fixed;inset-inline-start:50%;transform:translateX(-50%) translateY(140%);bottom:26px;z-index:120;background:#0E2A1B;color:#F5EBD8;font-size:14px;font-weight:500;padding:14px 26px;border-radius:9999px;box-shadow:0 16px 40px rgba(14,42,27,.28);transition:transform .45s cubic-bezier(.22,.61,.36,1);pointer-events:none"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/nabta-shop.js"></script>
  <script src="assets/js/nabta-chrome.js"></script>
  <script>
    (function () {
      var S = window.NabtaShop;
      NabtaChrome.mount('shop');

      var root = document.querySelector('[data-pdp]');
      var toast = document.querySelector('[data-toast]');
      var toastT;
      function showToast(msg) {
        toast.textContent = msg;
        toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(toastT);
        toastT = setTimeout(function () { toast.style.transform = 'translateX(-50%) translateY(140%)'; }, 2200);
      }

      var id = new URLSearchParams(location.search).get('id');
      var p = id ? S.find(id) : null;

      /* 404 state — a real PDP must handle a bad/stale product id.
         →API in the framework this becomes a proper 404 response, not a client render. */
      if (!p) {
        root.innerHTML =
          '<section style="max-width:760px;margin:0 auto;padding:clamp(90px,14vw,160px) clamp(16px,4vw,60px);text-align:center">' +
            '<p style="margin:0 0 14px;font-size:13px;letter-spacing:.3em;color:#6B4630">٤٠٤</p>' +
            '<h1 style="margin:0;font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:700">المنتج غير موجود</h1>' +
            '<p style="margin:18px 0 32px;font-size:16px;line-height:1.9;color:#3A483D;font-weight:300">ربما تم حذف المنتج أو أن الرابط غير صحيح.</p>' +
            '<a href="shop.html" class="btn-primary" style="display:inline-block;text-decoration:none">تصفّح كل المنتجات</a>' +
          '</section>';
        return;
      }

      document.title = p.name + ' | نبته NABTA';
      var md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute('content', p.shortDesc);

      var out = p.stock <= 0;
      var related = S.products().filter(function (r) {
        return r.id !== p.id && r.categorySlug === p.categorySlug;
      });
      if (related.length < 4) {
        related = related.concat(S.products().filter(function (r) {
          return r.id !== p.id && r.categorySlug !== p.categorySlug;
        }));
      }
      related = related.slice(0, 4);

      var gallery = p.images.map(function (src, i) {
        return '<button class="thumb" data-thumb="' + i + '" aria-pressed="' + (i === 0) + '" aria-label="صورة ' + (i + 1) + '">' +
          '<img src="' + src + '" alt="" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:contain;display:block">' +
        '</button>';
      }).join('');

      function accordion(title, body) {
        return '<div style="border-top:1px solid rgba(14,42,27,.1)">' +
          '<button class="acc-head" data-acc aria-expanded="false">' + title +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#176B3A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:0 0 auto;transition:transform .3s ease"><path d="M12 5v14M5 12h14"/></svg>' +
          '</button>' +
          '<div data-acc-body style="display:none;padding:0 0 20px;font-size:14px;line-height:1.95;color:#4a5a4e;font-weight:300">' + body + '</div>' +
        '</div>';
      }

      root.innerHTML = '' +
      '<section style="max-width:1560px;margin:0 auto;padding:clamp(28px,4vw,44px) clamp(16px,4vw,60px) 0">' +
        '<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6B4630;flex-wrap:wrap">' +
          '<a href="NABTA.dc.html#home" style="opacity:.8">الرئيسية</a><span>/</span>' +
          '<a href="shop.html" style="opacity:.8">المنتجات</a><span>/</span>' +
          '<a href="shop.html?cat=' + p.categorySlug + '" style="opacity:.8">' + p.category + '</a><span>/</span>' +
          '<span style="color:#176B3A;font-weight:600">' + p.name + '</span>' +
        '</div>' +
      '</section>' +

      '<section style="max-width:1560px;margin:0 auto;padding:clamp(28px,4vw,50px) clamp(16px,4vw,60px) clamp(50px,7vw,90px)">' +
        '<div class="pdp-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,64px);align-items:start">' +

          '<div>' +
            '<div style="position:relative;background:#F5EBD8;border-radius:4px;aspect-ratio:1/1;overflow:hidden">' +
              (out ? '<span style="position:absolute;top:18px;inset-inline-start:18px;z-index:2;background:rgba(14,42,27,.9);color:#F5EBD8;font-size:12px;font-weight:700;padding:7px 16px;border-radius:9999px">نفدت الكمية</span>' : '') +
              '<img data-hero-img src="' + p.images[0] + '" alt="' + p.name + '" style="position:absolute;inset:0;margin:auto;width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 22px 34px rgba(14,42,27,.2))' + (out ? ';opacity:.5' : '') + '">' +
            '</div>' +
            (p.images.length > 1 ? '<div style="display:flex;gap:12px;margin-top:14px">' + gallery + '</div>' : '') +
          '</div>' +

          '<div>' +
            '<p style="margin:0 0 12px;font-size:12px;letter-spacing:.22em;color:#6B4630;font-weight:500">' + p.category + '</p>' +
            '<h1 style="margin:0;font-size:clamp(1.8rem,3.6vw,2.9rem);line-height:1.25;font-weight:700;letter-spacing:-.02em">' + p.name + '</h1>' +
            '<p style="margin:16px 0 0;font-size:clamp(1.5rem,2.6vw,2rem);font-weight:700;color:#176B3A">' + S.fmt(p.price) + '</p>' +
            '<p style="margin:20px 0 0;font-size:15px;line-height:1.95;color:#3A483D;font-weight:300">' + p.description + '</p>' +

            '<div style="display:flex;align-items:center;gap:10px;margin:22px 0 0;font-size:13px;color:#6B4630">' +
              '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:' + (out ? '#B04A4A' : '#176B3A') + ';display:inline-block"></span>' +
              (out ? 'غير متوفر حالياً' : (p.stock <= 5 ? 'آخر ' + p.stock + ' قطع' : 'متوفر')) + '</span>' +
              '<span style="opacity:.4">·</span><span>' + p.weight + '</span>' +
              '<span style="opacity:.4">·</span><span>' + p.sku + '</span>' +
            '</div>' +

            (out ? '' :
            '<div style="display:flex;align-items:center;gap:14px;margin:26px 0 0;flex-wrap:wrap">' +
              '<div style="display:flex;align-items:center;border:1px solid rgba(14,42,27,.2);border-radius:2px;overflow:hidden">' +
                '<button class="qty-btn" data-qty="-1" aria-label="إنقاص">−</button>' +
                '<span data-qty-val style="min-width:52px;text-align:center;font-size:16px;font-weight:600">1</span>' +
                '<button class="qty-btn" data-qty="1" aria-label="زيادة">+</button>' +
              '</div>' +
              '<span data-stock-hint style="font-size:12px;color:#6B4630"></span>' +
            '</div>' +
            '<div style="display:flex;gap:12px;margin:22px 0 0;flex-wrap:wrap">' +
              '<button class="btn-primary" data-add style="flex:1;min-width:190px">أضف إلى السلة</button>' +
              '<button class="btn-ghost" data-buy style="flex:1;min-width:190px">اشترِ الآن</button>' +
            '</div>') +

            '<div style="display:flex;align-items:center;gap:10px;margin:24px 0 0;padding:16px 18px;background:#F5EBD8;border-radius:3px">' +
              '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#176B3A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8Z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
              '<p style="margin:0;font-size:13.5px;line-height:1.7;color:#2C3E30"><strong style="font-weight:600">الدفع عند الاستلام</strong> — تدفع للمندوب وقت التسليم. الشحن لكل المحافظات.</p>' +
            '</div>' +

            '<div style="margin-top:26px">' +
              accordion('المكوّنات', p.ingredients) +
              accordion('طريقة الاستخدام والحفظ', p.usage) +
              accordion('الشحن والاسترجاع', 'يتم التوصيل خلال ٢-٥ أيام عمل حسب المحافظة. يمكنك رفض الاستلام إذا وصل المنتج تالفاً. للاستفسار تواصل معنا عبر الهاتف الموضّح في الأسفل.') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</section>' +

      (related.length ? '<section style="background:#F5EBD8;padding:clamp(50px,7vw,90px) clamp(16px,4vw,60px)">' +
        '<div style="max-width:1560px;margin:0 auto">' +
          '<h2 style="margin:0 0 clamp(24px,3vw,40px);font-size:clamp(1.4rem,2.8vw,2.1rem);font-weight:600">قد يعجبك أيضاً</h2>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:clamp(16px,2vw,26px)">' +
            related.map(function (r) {
              return '<a href="product.html?id=' + r.id + '" style="display:flex;flex-direction:column;background:#FCFAF5;border:1px solid rgba(14,42,27,.1);border-radius:3px;overflow:hidden">' +
                '<div style="position:relative;background:#F5EBD8;aspect-ratio:1/1">' +
                  '<img src="' + r.images[0] + '" alt="' + r.name + '" loading="lazy" style="position:absolute;inset:0;margin:auto;width:78%;height:78%;object-fit:contain">' +
                '</div>' +
                '<div style="padding:16px">' +
                  '<p style="margin:0 0 6px;font-size:11.5px;letter-spacing:.12em;color:#6B4630">' + r.category + '</p>' +
                  '<p style="margin:0 0 8px;font-size:15px;font-weight:600;line-height:1.5">' + r.name + '</p>' +
                  '<p style="margin:0;font-size:16px;font-weight:700;color:#176B3A">' + S.fmt(r.price) + '</p>' +
                '</div>' +
              '</a>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</section>' : '');

      /* ---- interactions ---- */
      var qty = 1;
      var qtyVal = root.querySelector('[data-qty-val]');
      var hint = root.querySelector('[data-stock-hint]');
      function paintQty() {
        if (!qtyVal) return;
        qtyVal.textContent = qty;
        root.querySelector('[data-qty="-1"]').disabled = qty <= 1;
        root.querySelector('[data-qty="1"]').disabled = qty >= p.stock;
        hint.textContent = qty >= p.stock ? 'وصلت للحد المتاح في المخزون' : '';
      }
      paintQty();

      root.addEventListener('click', function (e) {
        var q = e.target.closest('[data-qty]');
        if (q) {
          qty = Math.min(p.stock, Math.max(1, qty + parseInt(q.getAttribute('data-qty'), 10)));
          paintQty();
          return;
        }
        var t = e.target.closest('[data-thumb]');
        if (t) {
          var i = +t.getAttribute('data-thumb');
          root.querySelector('[data-hero-img]').src = p.images[i];
          root.querySelectorAll('[data-thumb]').forEach(function (b) {
            b.setAttribute('aria-pressed', String(b === t));
          });
          return;
        }
        var acc = e.target.closest('[data-acc]');
        if (acc) {
          var open = acc.getAttribute('aria-expanded') === 'true';
          acc.setAttribute('aria-expanded', String(!open));
          acc.nextElementSibling.style.display = open ? 'none' : 'block';
          acc.querySelector('svg').style.transform = open ? '' : 'rotate(45deg)';
          return;
        }
        if (e.target.closest('[data-add]')) {
          S.addToCart(p.id, qty);
          showToast('تمت الإضافة إلى السلة — ' + p.name);
          return;
        }
        if (e.target.closest('[data-buy]')) {
          S.addToCart(p.id, qty);
          location.href = 'checkout.html';
        }
      });
    })();
  </script>
</body>
</html>
